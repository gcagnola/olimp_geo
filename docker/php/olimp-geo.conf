ServerName fhuc0.unl.edu.ar

Alias /olimp_geo /var/www/html/public

<Directory /var/www/html/public>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted

    RewriteEngine On

    # Mantener disponible el prefijo público /olimp_geo
    RewriteBase /olimp_geo/

    # Enviar a Laravel todo lo que no sea archivo o directorio real
    RewriteCond %{REQUEST_URI} !^/olimp_geo/index\.php
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ /olimp_geo/index.php [L,QSA]
</Directory>

DirectoryIndex index.php
